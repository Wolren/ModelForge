name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PLUGIN_DIR: model_forge

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint plugin source
        run: ruff check $PLUGIN_DIR/
      - name: Validate metadata.txt
        run: |
          if [ ! -f $PLUGIN_DIR/metadata.txt ]; then
            echo "::error file=$PLUGIN_DIR/metadata.txt::$PLUGIN_DIR/metadata.txt not found"
            exit 1
          fi
          grep -q "^name=" $PLUGIN_DIR/metadata.txt \
            || { echo "::error file=$PLUGIN_DIR/metadata.txt::Missing 'name'"; exit 1; }
          grep -q "^version=" $PLUGIN_DIR/metadata.txt \
            || { echo "::error file=$PLUGIN_DIR/metadata.txt::Missing 'version'"; exit 1; }
          grep -q "^qgisMinimumVersion=" $PLUGIN_DIR/metadata.txt \
            || { echo "::error::Missing 'qgisMinimumVersion'"; exit 1; }
          grep -q "^description=" $PLUGIN_DIR/metadata.txt \
            || { echo "::error::Missing 'description'"; exit 1; }
          echo "metadata.txt validation complete"

  package:
    name: Package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check zip builds
        run: |
          if [ -f package.py ]; then
            python package.py
            echo "Package built successfully"
          else
            cd $PLUGIN_DIR && zip -r ../$PLUGIN_DIR.zip . && cd ..
            echo "Zipped plugin directory"
          fi
      - name: Verify zip structure
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No zip file produced"
            exit 1
          fi
          echo "Zip: $ZIP"
          unzip -l "$ZIP" | head -5
          unzip -l "$ZIP" | grep -q "metadata.txt" \
            && echo "metadata.txt found in zip" \
            || echo "::error::metadata.txt not in zip"

  qgis-compat:
    name: QGIS ${{ matrix.qgis_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_version:
          - "3.22-focal"
          - "stable"
          - "4.2-trixie"
          - "latest"
    steps:
      - uses: actions/checkout@v7
      - name: Test plugin in QGIS ${{ matrix.qgis_version }}
        run: |
          cat > /tmp/test_plugin.py << 'PYEOF'
          import importlib
          import os
          import sys
          plugin_dir = os.environ["PLUGIN_DIR"]
          plugin_path = os.path.join("/plugin", plugin_dir)
          sys.path.insert(0, "/plugin")

          errors = 0

          # 1. Module import
          print("=== Plugin import test ===")
          try:
              mod = importlib.import_module(plugin_dir)
              print(f"Plugin loaded: {mod}")
          except Exception as e:
              print(f"::error::Plugin import failed: {e}")
              sys.exit(1)

          # 2. QGIS and Qt version output
          print()
          print("=== QGIS / Qt version ===")
          try:
              from qgis.core import Qgis
              print(f"QGIS version: {Qgis.QGIS_VERSION}")
              print(f"QGIS release: {Qgis.QGIS_RELEASE_NAME}")
              print(f"QGIS dev version: {Qgis.QGIS_DEV_VERSION}")
          except Exception as e:
              print(f"  (qgis.core not available: {e})")

          try:
              from qgis.PyQt.QtCore import QT_VERSION_STR, PYQT_VERSION_STR
              print(f"Qt version: {QT_VERSION_STR}")
              print(f"PyQt version: {PYQT_VERSION_STR}")
          except Exception as e:
              print(f"  (Qt not available: {e})")

          # 3. classFactory and lifecycle
          print()
          print("=== classFactory / lifecycle ===")
          if hasattr(mod, "classFactory"):
              cf = mod.classFactory
              print(f"classFactory: {cf}")
              import inspect
              sig = inspect.signature(cf)
              params = list(sig.parameters.keys())
              print(f"  Parameters: {params}")
              if "iface" not in params:
                  print("::error::classFactory() missing 'iface' parameter")
                  errors += 1
          else:
              print("::error::Plugin has no classFactory()")
              errors += 1

          for attr in ["metadata", "name", "icon", "description", "version"]:
              if hasattr(mod, attr):
                  val = getattr(mod, attr)
                  print(f"  Plugin.{attr}: {val}")
              else:
                  print(f"  Plugin.{attr}: (not set)")

          # 4. Plugin metadata from metadata.txt
          print()
          print("=== metadata.txt ===")
          meta_path = os.path.join(plugin_path, "metadata.txt")
          if os.path.isfile(meta_path):
              with open(meta_path) as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("[") and "=" in line:
                          print(f"  {line}")
          else:
              print("::error::metadata.txt not found in plugin dir")
              errors += 1

          # 5. Run tests if they exist
          print()
          tests_path = "/plugin/tests"
          if os.path.isdir(tests_path):
              print("=== Running tests ===")
              import subprocess
              result = subprocess.run(
                  [sys.executable, "-m", "pytest", "tests/", "-v", "--tb=short", "-p", "no:cacheprovider"],
                  cwd="/plugin",
                  capture_output=True, text=True
              )
              print(result.stdout)
              if result.stderr:
                  print(result.stderr)
              if result.returncode != 0:
                  print(f"::warning::Some tests failed (exit code {result.returncode})")
          else:
              print("No tests/ directory - import check only")

          if errors:
              print(f"::error::{errors} error(s) found")
              sys.exit(1)
          print()
          print("All checks passed")
          PYEOF

          docker run --rm \
            -v $PWD:/plugin \
            -e PLUGIN_DIR=$PLUGIN_DIR \
            -e QT_QPA_PLATFORM=offscreen \
            -v /tmp/test_plugin.py:/test_plugin.py \
            qgis/qgis:${{ matrix.qgis_version }} \
            sh -c "
              set -e
              if [ ! -d \"/plugin/\$PLUGIN_DIR\" ]; then
                echo \"::error::Plugin dir /plugin/\$PLUGIN_DIR not found\"
                ls /plugin/
                exit 1
              fi
              mkdir -p /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins
              ln -s /plugin/\$PLUGIN_DIR /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/\$PLUGIN_DIR
              python3 /test_plugin.py
            "
